<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ecosystem Island</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="map"></canvas>

<div id="hud" class="overlay">
  <h1>Ecosystem Island &mdash; gazelle &middot; lion &middot; jackal</h1>
  <div id="bar">
    <button id="play">&#9654; play</button>
    <button id="pause">&#10073;&#10073; pause</button>
    <button id="step">step</button>
    <button id="auto">auto</button>
    <label>speed <input type="range" id="speed" min="1" max="40" value="10"></label>
    <span id="speedval">10 t/s</span>
    <span id="tick">tick 0</span>
    <label>seed <input type="number" id="seed" value="7"></label>
    <button id="newrun">new run</button>
    <label class="chk"><input type="checkbox" id="sample" checked> sample</label>
  </div>
  <div id="pops"></div>
</div>

<div id="jev" class="overlay"></div>
<div id="charts" class="overlay">
  <div class="ctitle">jev / tick</div>
  <canvas id="chart" width="300" height="150"></canvas>
</div>
<div id="events" class="overlay"></div>

<div id="widget" class="overlay">
  <div id="whead">
    <span><span class="sel-ring">&#9678;</span> <span id="wtitle"></span></span>
    <button id="wclose" title="close">&times;</button>
  </div>
  <div id="wbody">
    <div id="wdead">deceased</div>
    <pre id="wstate"></pre>
    <div id="waction"></div>
    <div id="wbars"></div>
    <div id="whistlabel">decision history</div>
    <div id="whist"></div>
  </div>
</div>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
