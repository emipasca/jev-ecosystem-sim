<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ecosystem Island</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; background: #10141a; color: #cfd8e3;
    font: 14px/1.5 system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 16px;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .3px; color: #e8eef6; }
  #bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
  }
  button {
    background: #223047; color: #dbe6f3; border: 1px solid #33465f;
    border-radius: 6px; padding: 5px 14px; font: inherit; cursor: pointer;
  }
  button:hover { background: #2b3d59; }
  #tick { font-variant-numeric: tabular-nums; color: #9fb3c8; min-width: 90px; }
  #pops { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .pop { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  canvas { border: 1px solid #2a3648; border-radius: 4px; image-rendering: pixelated; }
  #events {
    width: 700px; max-width: 95vw; height: 118px; overflow: hidden;
    font: 12px/1.45 ui-monospace, monospace; color: #8fa1b5;
    border-top: 1px solid #2a3648; padding-top: 6px;
  }
  #speedval { color: #9fb3c8; min-width: 56px; font-variant-numeric: tabular-nums; }
  label { color: #9fb3c8; }
</style>
</head>
<body>
<h1>Ecosystem Island &mdash; gazelle &middot; lion &middot; jackal</h1>
<div id="bar">
  <button id="play">&#9654; play</button>
  <button id="pause">&#10073;&#10073; pause</button>
  <button id="step">step</button>
  <label>speed <input type="range" id="speed" min="1" max="40" value="10"></label>
  <span id="speedval">10 t/s</span>
  <span id="tick">tick 0</span>
</div>
<div id="pops"></div>
<canvas id="map" width="700" height="700"></canvas>
<div id="events"></div>

<script>
"use strict";

// terrain id -> [barren RGB, lush RGB]; cells blend by vegetation level
const TERRAIN_COLORS = [
  [[24, 52, 84],   [24, 52, 84]],    // sea
  [[214, 197, 142],[214, 197, 142]], // beach
  [[164, 155, 104],[ 98, 141, 70]],  // grassland
  [[148, 143, 94], [112, 126, 66]],  // brush
  [[ 82, 100, 66], [ 42, 86, 48]],   // forest
  [[139, 135, 131],[139, 135, 131]], // rocky highland
  [[104, 117, 94], [ 76, 105, 82]],  // marsh
];
const CARCASS_COLOR = "#8c2f26";

let world = null, base = null, offscreen = null, off = null;
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

async function init() {
  world = await (await fetch("api/world")).json();
  offscreen = document.createElement("canvas");
  offscreen.width = world.w; offscreen.height = world.h;
  off = offscreen.getContext("2d");
  base = off.createImageData(world.w, world.h);
  poll();
  setInterval(poll, 100);
}

let polling = false;
async function poll() {
  if (polling || document.hidden) return;
  polling = true;
  try {
    const s = await (await fetch("api/state")).json();
    render(s);
  } catch (e) { /* server restarting; keep trying */ }
  polling = false;
}

function render(s) {
  const { w, h, terrain, veg_max } = world;
  const px = base.data;
  const veg = s.veg;
  for (let i = 0; i < w * h; i++) {
    const [dry, lush] = TERRAIN_COLORS[terrain[i]];
    let t = 0;
    if (veg_max[i] > 0) t = Math.min(1, veg[i] / veg_max[i]);
    const j = i * 4;
    px[j]     = dry[0] + (lush[0] - dry[0]) * t;
    px[j + 1] = dry[1] + (lush[1] - dry[1]) * t;
    px[j + 2] = dry[2] + (lush[2] - dry[2]) * t;
    px[j + 3] = 255;
  }
  off.putImageData(base, 0, 0);
  ctx.drawImage(offscreen, 0, 0, canvas.width, canvas.height);

  const sc = canvas.width / w;
  // carcasses: dark red crosses
  ctx.fillStyle = CARCASS_COLOR;
  for (const c of s.carcasses) {
    ctx.fillRect(c.x * sc - 1, c.y * sc + sc / 2 - 1, sc + 2, 2);
    ctx.fillRect(c.x * sc + sc / 2 - 1, c.y * sc - 1, 2, sc + 2);
  }
  // animals: dots by species (lions drawn bigger)
  for (const a of s.animals) {
    const color = world.species_colors[a.species] || "#fff";
    const r = a.species === "lion" ? sc * 1.1 : a.adult ? sc * 0.75 : sc * 0.5;
    ctx.beginPath();
    ctx.arc(a.x * sc + sc / 2, a.y * sc + sc / 2, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(0,0,0,.55)";
    ctx.stroke();
  }

  document.getElementById("tick").textContent = "tick " + s.tick;
  const pops = document.getElementById("pops");
  const order = ["gazelle", "lion", "jackal"];
  pops.innerHTML = order.map(sp => {
    const n = s.populations[sp] || 0;
    return `<span class="pop"><span class="dot" style="background:${world.species_colors[sp]}"></span>${sp}: <b>${n}</b></span>`;
  }).join("") +
    `<span class="pop">carcasses: <b>${s.carcasses.length}</b></span>` +
    `<span class="pop">vegetation: <b>${(s.veg.reduce((a, b) => a + b, 0) / 1000).toFixed(0)}k</b></span>`;
  document.getElementById("events").innerHTML =
    s.events.slice().reverse().map(e => e.replace(/</g, "&lt;")).join("<br>");
}

async function control(cmd, value) {
  const q = value !== undefined ? `&value=${value}` : "";
  await fetch(`api/control?cmd=${cmd}${q}`);
}
document.getElementById("play").onclick = () => control("play");
document.getElementById("pause").onclick = () => control("pause");
document.getElementById("step").onclick = () => control("step");
document.getElementById("speed").oninput = (e) => {
  document.getElementById("speedval").textContent = e.target.value + " t/s";
  control("speed", e.target.value);
};

init();
</script>
</body>
</html>
